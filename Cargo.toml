# worddrop — Cargo workspace
# Cross-platform WAN file transfer: Windows/macOS GUI, Linux CLI, Android.
# Transport: iroh 1.0 (QUIC, NAT hole-punching, relay fallback, E2E encryption).
# Pairing: SPAKE2 word-code (nameplate-word-word-word), rendezvous sees nameplate only.

[workspace]
resolver = "2"
members = ["crates/core", "crates/rendezvous", "crates/cli"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "MIT"
authors = ["worddrop contributors"]
rust-version = "1.97"

# Pinned exactly (plan, review-approved): iroh 1.0.3 + iroh-blobs 0.103
# (NOT drift's 0.99 - incompatible API) + spake2 0.4.0 (start_symmetric verified).
[workspace.dependencies]
iroh = "1.0.3"
iroh-blobs = "0.103"
spake2 = "0.4.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dirs = "6"
# T8: stream utilities for the AddProgressItem import stream (sendme pins
# n0-future = "0.3"; already in the lockfile via iroh's tree - no new versions).
n0-future = "0.3"
# T5: MQTT rendezvous backend. use-rustls-no-provider (not use-rustls): core's
# install_tls_provider already installs the global rustls crypto provider
# (OnceLock, idempotent); use-rustls would install a second time and panic.
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
argon2 = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
