# iroh-relay production configuration (systemd / bare-metal path).
#
# Copy to /etc/iroh-relay/relay.toml on the VPS. The relay serves the FULL
# protocol (incl. /relay WebSocket + "Iroh Relay" page) on plain HTTP :80 —
# deliberately WITHOUT a [tls] section.
#
# WHY: with a [tls] section the relay binds its full protocol server to the
# internal https_bind_addr (:443) and :80 serves only a 404 captive portal,
# while its built-in ACME (tokio-rustls-acme 0.9.1) supports ONLY TLS-ALPN-01
# (no HTTP-01) — so relay-side Let's Encrypt cannot complete when host 80/443
# TCP is owned by Caddy. Instead Caddy (sole host owner of 80/443 TCP and sole
# cert issuer) terminates TLS for both domains with its own LE certs and
# reverse-proxies relay.worddrop.cloud (incl. WebSocket /relay) to this plain
# HTTP :80. Clients dial wss://relay.worddrop.cloud/relay on TCP 443 and
# validate Caddy's PUBLIC certs against stock webpki roots.
#
# NOTE: never commit real certificates/keys to the repo; with this design the
# relay holds no certs at all — they live in Caddy's caddy-data volume.

# Relay HTTP server address (full protocol server — plain HTTP, no TLS).
http_bind_addr = "0.0.0.0:80"

# --- Metrics --------------------------------------------------------------
# metrics server binds [::]:9090 by default; disable if you don't use it:
# enable_metrics = false

# --- Rate limiting (optional) --------------------------------------------
# [limits]
# accept_conn_limit = 1000.0
# accept_conn_burst = 1000
# [limits.client.rx]
# bytes_per_second = 1_000_000

# --- Access control (optional) -------------------------------------------
# Restrict relaying to a bearer token shared by your clients:
#   iroh clients would send `Authorization: Bearer <token>` — worddrop does
#   not set this header, so enabling this REQUIRES a patched client.
# access.shared_token = ["change-me"]
