# iroh-relay 1.0.3 production configuration template.
#
# Copy to /etc/iroh-relay/relay.toml on the VPS and fill in the values.
# The relay serves HTTPS on 443 and QUIC (relay address discovery) on UDP 7842.
# Clients then use https://relay.example.com as their relay URL — the iroh
# client verifies the cert against Mozilla's bundled webpki roots, so the cert
# MUST come from a public CA (Let's Encrypt below, or Manual mode with a
# CA-issued cert). Self-signed certs CANNOT be trusted by stock iroh clients
# (no custom-CA/disable-verify API in iroh 1.0.3) — see deploy/README.md.
#
# NOTE: never commit real certificates/keys to the repo; this is a template only.

# Relay HTTP server address. With TLS configured below, the HTTP socket only
# serves the captive portal; all real relay services move to HTTPS.
# http_bind_addr = "[::]:80"        # default when unset

[tls]
# --- Option A: Let's Encrypt (recommended) -------------------------------
# iroh-relay runs the ACME flow itself (tokio-rustls-acme). Requires a public
# hostname and the relay reachable from the internet on 443/80.
cert_mode = "LetsEncrypt"
hostname = ["relay.example.com"]       # replace with your domain
contact = "admin@example.com"          # ACME account email (required)
prod_tls = true                        # true = LE production, false = staging
cert_dir = "/var/lib/iroh-relay"       # ACME cache dir (must be writable)

# --- Option B: Manual certificates ---------------------------------------
# Use with a cert issued by any public CA (e.g. via certbot --standalone,
# or a cert obtained elsewhere and copied in). Place the files so the
# service user can read them.
# cert_mode = "Manual"
# https_bind_addr = "[::]:443"         # default when unset
# quic_bind_addr = "[::]:7842"         # default when unset
# cert_dir = "/etc/iroh-relay"
# manual_cert_path = "/etc/iroh-relay/default.crt"
# manual_key_path = "/etc/iroh-relay/default.key"

# QUIC address discovery: lets iroh clients learn their observed address via
# QUIC on UDP 7842 (helps NAT hole-punching). Requires TLS. Optional.
# enable_quic_addr_discovery = true

# --- Access control (optional) -------------------------------------------
# Restrict relaying to a bearer token shared by your clients:
#   iroh clients would send `Authorization: Bearer <token>` — my-croc does
#   not set this header, so enabling this REQUIRES a patched client.
# access.shared_token = ["change-me"]

# --- Rate limiting (optional) --------------------------------------------
# [limits]
# accept_conn_limit = 1000.0
# accept_conn_burst = 1000
# [limits.client.rx]
# bytes_per_second = 1_000_000

# --- Metrics --------------------------------------------------------------
# metrics server binds [::]:9090 by default; disable if you don't use it:
# enable_metrics = false
