# my-croc-core — shared core library
# Pairing (SPAKE2 word-code), session state machine, iroh transfer engine,
# persistent identity, resume records. Used by CLI, GUI (via FRB bridge) and Android.

[package]
name = "my-croc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
iroh = { workspace = true }
iroh-blobs = { workspace = true }
spake2 = { workspace = true, features = ["std"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
rand = "0.9"
# T8: consume the AddProgressItem import stream (n0_future::StreamExt; version already in lockfile).
n0-future = { workspace = true }
# T3: HKDF key confirmation (versions already in lockfile via spake2's tree).
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
# T11 e2e: spawn the axum rendezvous server in-process (programmatic start).
my-croc-rendezvous = { path = "../rendezvous" }
