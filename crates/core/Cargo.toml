# worddrop-core — shared core library
# Pairing (SPAKE2 word-code), session state machine, iroh transfer engine,
# persistent identity, resume records. Used by CLI, GUI (via FRB bridge) and Android.

[package]
name = "worddrop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
iroh = { workspace = true }
iroh-blobs = { workspace = true }
spake2 = { workspace = true, features = ["std"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
rand = "0.9"
# T8: consume the AddProgressItem import stream (n0_future::StreamExt; version already in lockfile).
n0-future = { workspace = true }
# T3: HKDF key confirmation (versions already in lockfile via spake2's tree).
hkdf = "0.12"
sha2 = "0.10"
# N4/F2: SessionKey ZeroizeOnDrop (zeroize already in the lockfile via
# iroh/spake2's tree — only the dep edge is added).
zeroize = "1"
# T4: pin the rustls process default to ring (already in the lockfile via
# iroh's tls-ring feature) — the tree enables both ring and aws-lc-rs, which
# rustls rejects as ambiguous without an explicit install_default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }

[dev-dependencies]
# T11 e2e: spawn the axum rendezvous server in-process (programmatic start).
worddrop-rendezvous = { path = "../rendezvous" }
