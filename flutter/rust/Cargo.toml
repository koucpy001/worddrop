# worddrop flutter_rust_bridge bridge crate (drift_bridge pattern).
#
# Standalone workspace on purpose: FRB codegen + cargokit build this crate
# independently of the root worddrop workspace (same layout as drift's
# flutter/rust crate). The root rust-toolchain.toml (1.97.1) still applies
# because rustup walks up from this directory.
#
# NOTE: package name MUST use underscores (worddrop_bridge), not dashes:
# cargokit derives the artifact name from the package name, while cargo
# replaces dashes with underscores in the cdylib file name, so a dash-name
# crate would produce libworddrop-bridge.so while cargokit looks for
# libworddrop_bridge.so (drift_bridge uses the same underscore convention).

[package]
name = "worddrop_bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# T17: real worddrop API surface. Core for engine/session/wordcode, cli for the
# wire helpers (ControlAcceptor, SPAKE2 sides, hello, peer-close) + rendezvous
# client + config file — the bridge is a thin facade reusing the CLI's proven
# pieces (no logic duplicated). iroh/iroh-blobs only for RelayMode/BlobTicket
# (DTOs never leak iroh types to Dart); rand for WordCode::generate.
worddrop-core = { path = "../../crates/core" }
worddrop-cli = { path = "../../crates/cli" }
iroh = "1.0.3"
iroh-blobs = "0.103"
rand = "0.9"

[dev-dependencies]
# T17 e2e: spawn the real T6 rendezvous server in-process on an ephemeral port
# (same dev-dep pattern as crates/cli/tests).
worddrop-rendezvous = { path = "../../crates/rendezvous" }

[profile.release]
# T22 windows CI: ThinLTO + codegen-units=1 over the iroh tree OOMs the MSVC
# linker on 7GB runners (MSB8066 exit -1 in the cargokit rule). Relax to
# codegen-units=8 + lto=false for windows-build reliability; the linux/android
# release artifacts still build fine with these settings.
codegen-units = 8
lto = false
opt-level = "z"
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
