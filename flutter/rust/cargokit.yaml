# Pin the toolchain cargokit uses to build the bridge crate.
#
# cargokit defaults to `stable` (options.dart Toolchain.stable) and its
# rustup probe filters installed toolchains with `^(stable|beta|nightly)`
# (rustup.dart), so a rust-toolchain.toml pin of 1.97.1 is invisible to it:
# without this file cargokit would `rustup toolchain install stable` and build
# the bridge with a DIFFERENT toolchain than the rest of the workspace
# (observed on the windows CI job — MSB8066 exit -1 in the cargokit rule).
# 1.97.1 matches rust-toolchain.toml at the repo root.
cargo:
  debug:
    toolchain: "1.97.1"
  release:
    toolchain: "1.97.1"
